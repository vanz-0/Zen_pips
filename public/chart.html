<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chart</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #131722; }
        .tradingview-widget-container { width: 100%; height: 100%; }
        .tradingview-widget-container__widget { width: 100%; height: 100%; }
        .tradingview-widget-copyright { display: none !important; }
    </style>
</head>
<body>
    <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script>
            // Parse URL params
            const p = new URLSearchParams(window.location.search);
            const sym = p.get('symbol') || 'OANDA:EURUSD';
            const thm = p.get('theme') || 'dark';

            if (thm === 'light') document.body.style.background = '#fff';

            // Inject the TradingView embed widget script
            const s = document.createElement('script');
            s.type = 'text/javascript';
            s.async = true;
            s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
            s.textContent = JSON.stringify({
                "autosize": true,
                "symbol": sym,
                "interval": "15",
                "timezone": "Etc/UTC",
                "theme": thm,
                "style": "1",
                "locale": "en",
                "allow_symbol_change": true,
                "calendar": false,
                "hide_volume": false,
                "support_host": "https://www.tradingview.com"
            });
            document.querySelector('.tradingview-widget-container__widget').appendChild(s);
        </script>
    </div>
</body>
</html>
