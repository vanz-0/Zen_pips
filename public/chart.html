<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradingView Chart</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #131722; /* Default dark */
        }
        #tv_chart_container {
            width: 100%;
            height: 100%;
        }
        /* Hide the bottom TradingView copyright banner to reclaim space */
        .tradingview-widget-copyright {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div id="tv_chart_container" style="height:100%;width:100%"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const symbol = urlParams.get('symbol') || 'OANDA:EURUSD';
        const theme = urlParams.get('theme') || 'dark';

        if (theme === 'light') {
            document.body.style.backgroundColor = '#ffffff';
        }

        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": theme,
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "save_image": false, // Crucial for iOS Safari: Prevents localStorage usage which triggers ITP blocks
            "container_id": "tv_chart_container"
        });
    </script>
</body>
</html>
